[project]
name = "rockwell-file-research"
version = "0.1.0"
description = "Private-fixture research tools for industrial project formats"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "acd-tools>=0.2a8",
    "olefile>=0.47",
]

[project.optional-dependencies]
validation = [
    "jsonschema>=4.23",
]

[project.scripts]
ccw-report = "rockwell_file_research.ccw.cli:main"
publication-check = "rockwell_file_research.publication:main"
rss-inventory = "rockwell_file_research.rss.cli:main"
rss-fixture-check = "rockwell_file_research.rss.fixture_cli:main"
plc-hmi-cross-reference = "rockwell_file_research.integration.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rockwell_file_research*"]

[tool.setuptools.package-data]
"rockwell_file_research.ccw.schemas" = ["*.json"]

[tool.pyright]
include = [
    "rockwell_file_research",
    "ccw_report.py",
    "convert.py",
    "main.py",
    "tests",
]
exclude = [
    # Preserve Pyright's default exclusions when defining project exclusions.
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    # Login-gated, private, and derived fixture material stays outside analysis.
    "src",
    "PV800_PumpControl_V2.1",
    "Project5",
    "cha-experiments",
    "outputs",
    "private-fixtures",
    "private-outputs",
]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
addopts = "--basetemp=.test-artifacts"
pythonpath = ["."]

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pyright>=1.1.411",
    "pytest>=8.4.1",
    "ruff>=0.15.20",
]
